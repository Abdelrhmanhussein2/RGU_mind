services:
  postgres:
    image: postgres:16
    container_name: Rgu_mind_server
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: Rgu_mind_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  server:
    build:
      context: ../src
      dockerfile: Dockerfile
    container_name: Rgu_mind_backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
    volumes:
      - ../src:/app

volumes:
  postgres_data:
  qdrant_data: